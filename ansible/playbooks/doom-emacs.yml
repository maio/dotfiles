---

- name: emacs
  package:
    name:
      - emacs-nox
      - aspell
      - aspell-en
      - shellcheck
      - direnv
      - fd-find  # binary is fdfind, which doom looks for
    state: present
  become: yes
  when: ansible_facts['system'] == 'Linux'

- name: emacs tools
  homebrew:
    name:
      - aspell
      - shellcheck
      - direnv
      - fd
    state: present
  when: ansible_facts['system'] == 'Darwin'

- name: direnv hook
  lineinfile: dest=~/.bashrc create=yes regexp='direnv hook' line='eval "$(direnv hook bash)"'

- name: checkout doom emacs
  git:
    repo: https://github.com/doomemacs/doomemacs
    dest: ~/.emacs.d
  register: checkout_result

- name: doom PATH
  lineinfile: dest=~/.bashrc create=yes regexp='\.emacs\.d/bin' line='export PATH="$HOME/.emacs.d/bin:$PATH"'

- name: doom emacs config
  file:
    src: "{{playbook_dir}}/../emacs/doom"
    dest: "~/.doom.d"
    state: link

- name: config checksum
  shell: cat ~/.doom.d/* | md5sum > ~/.doom.d-checksum-new && diff -N ~/.doom.d-checksum ~/.doom.d-checksum-new || true
  register: diff_result

- name: sync doom emacs
  shell: ~/.emacs.d/bin/doom sync && cat ~/.doom.d-checksum-new > ~/.doom.d-checksum
  when: diff_result.stdout != "" or checkout_result.before != checkout_result.after
