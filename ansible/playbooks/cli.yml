---

- name: install packages
  package:
    name:
      - git
      - curl
      - tree
      - ripgrep
      - jq
      - vim
      - rsync
      - parallel
    state: present
  become: yes
  when: ansible_facts['system'] == 'Linux'

- name: install macos packages
  homebrew:
    name:
      - git
      - curl
      - tree
      - ripgrep
      - the_silver_searcher
      - jq
      - vim
      - watch
      - rsync
      - parallel
      - openssl
    state: present
  when: ansible_facts['system'] == 'Darwin'

- name: OpenSSL PATH
  blockinfile:
    path: ~/.bashrc
    marker: "# {mark} Use OpenSSL from brew by default"
    block: |
      export PATH="/usr/local/opt/openssl@1.1/bin:$PATH"
  when: ansible_facts['system'] == 'Darwin'
